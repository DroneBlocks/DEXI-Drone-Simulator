name: Claude AI Agent

on:
  issues:
    types: [labeled]

jobs:
  claude-agent:
    if: github.event.label.name == 'claude-work'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Get issue details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            core.setOutput('title', issue.data.title);
            core.setOutput('body', issue.data.body);
            core.setOutput('number', context.issue.number);

      - name: Run Claude Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Create prompt from issue
          cat << 'EOF' > /tmp/prompt.txt
          You are working on the DEXI-Drone-Simulator Unity project.

          Issue #${{ steps.issue.outputs.number }}: ${{ steps.issue.outputs.title }}

          ${{ steps.issue.outputs.body }}

          Instructions:
          1. Analyze the issue and understand what needs to be fixed
          2. Make the necessary code changes
          3. Test your changes compile (if possible)
          4. Commit your changes with a clear message referencing the issue
          5. Do not push - the workflow will handle that
          EOF

          # Run Claude Code with the prompt
          claude --print --dangerously-skip-permissions < /tmp/prompt.txt

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: address issue #${{ steps.issue.outputs.number }}"
          title: "Fix: ${{ steps.issue.outputs.title }}"
          body: |
            Automated fix for #${{ steps.issue.outputs.number }}

            ## Changes
            This PR was generated by Claude AI Agent based on the issue description.

            ## Issue
            ${{ steps.issue.outputs.body }}

            ---
            Please review the changes carefully before merging.
          branch: claude-fix-${{ steps.issue.outputs.number }}
          delete-branch: true

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 Claude AI Agent has created a pull request to address this issue. Please review the changes.'
            });
